 height="62" rx="8" ry="8" fill="#EDE7F6" stroke="#5B3F9E" stroke-width="1.6"/><text x="702.0" y="270.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">PostgreSQL</text><text x="702.0" y="284.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">7 canonical + 5 operational</text><text x="702.0" y="298.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">tables</text><polyline points="702,196 702,250" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="702.0,250.0 698.2,241.8 705.8,241.8" fill="#52606D"/><rect x="701.0" y="221.1" width="29.8" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="704" y="232.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606D">valid</text><polyline points="616,281 632,281" fill="none" stroke="#52606D" stroke-width="2"/><polygon points="632.0,281.0 623.8,284.8 623.8,277.2" fill="#52606D"/><rect x="632" y="346" width="140" height="44" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="702.0" y="364.09000000000003" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">FastAPI /api/v1</text><text x="702.0" y="378.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">read-only routes</text><polyline points="702,312 702,346" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="702.0,346.0 698.2,337.8 705.8,337.8" fill="#52606D"/><rect x="701.0" y="323.1" width="56.2" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="704" y="334.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606D">served by</text><rect x="8" y="214" width="440" height="98" rx="10" ry="10" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1.6" stroke-dasharray="3,3"/><text x="20" y="233" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#52606D">Ingestion orchestrator (E1)</text><text x="20" y="252.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606D">One transaction per fetched page, advisory lock per entity.</text><text x="20" y="266.375" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606D">Run status: SUCCESS, PARTIAL_SUCCESS, FAILED or NOOP.</text><text x="20" y="280.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606D">Cursor advances only when an entity's last page commits.</text><text x="8" y="418" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#52606D">Layer 2 consumers read canonical records only through the API contract.</text></svg>