<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600"><rect width="780" height="600" fill="#FFFFFF"/><rect x="8" y="8" width="764" height="410" rx="12" ry="12" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1.6" stroke-dasharray="3,3"/><text x="20" y="28" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606D">Browser: AI CEO HQ single-page app (React, TypeScript)</text><rect x="20" y="42" width="236" height="78" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="138.0" y="63.059999999999995" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Office</text><text x="138.0" y="77.08999999999999" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">3D pixel-art rooms, agents as VS-01</text><text x="138.0" y="91.11999999999999" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">components; lazy chunk, never loaded in</text><text x="138.0" y="105.14999999999999" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Classic</text><rect x="272" y="42" width="236" height="78" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="390.0" y="70.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Classic view</text><text x="390.0" y="84.105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Plain pages: inbox, brief, agents; works without</text><text x="390.0" y="98.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">WebGL</text><rect x="524" y="42" width="236" height="78" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="642.0" y="70.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">HUD and panels</text><text x="642.0" y="84.105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Health, as_of, Run assessment, Replay,</text><text x="642.0" y="98.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">toggles, tour, panels, decision form</text><rect x="20" y="140" width="740" height="76" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="390.0" y="167.07500000000002" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Domain layer</text><text x="390.0" y="181.10500000000002" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Pure modules, no React or I/O: inbox ordering, brief view model, decision chain, money and date formatting, episodes (replay steps with a source route and</text><text x="390.0" y="195.13500000000002" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">JSON path), roster</text><rect x="20" y="236" width="360" height="64" rx="8" ry="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.6"/><text x="200.0" y="257.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">State</text><text x="200.0" y="271.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">TanStack Query for server state; Zustand for view state; browser storage</text><text x="200.0" y="285.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">for conveniences only</text><rect x="400" y="236" width="360" height="64" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="580.0" y="257.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">API client</text><text x="580.0" y="271.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Every response parsed with Zod; ApiError, NetworkError, ContractError;</text><text x="580.0" y="285.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">X-Request-ID kept; GET retried at most twice; a POST is never retried</text><polyline points="580,216 580,236" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="580.0,236.0 576.2,227.8 583.8,227.8" fill="#52606D"/><polyline points="200,216 200,236" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="200.0,236.0 196.2,227.8 203.8,227.8" fill="#52606D"/><polyline points="380,268 400,268" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="400.0,268.0 391.8,271.8 391.8,264.2" fill="#52606D"/><polygon points="380.0,268.0 388.2,264.2 388.2,271.8" fill="#52606D"/><polyline points="140,120 140,140" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="140.0,140.0 136.2,131.8 143.8,131.8" fill="#52606D"/><polygon points="140.0,120.0 143.8,128.2 136.2,128.2" fill="#52606D"/><polyline points="390,120 390,140" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="390.0,140.0 386.2,131.8 393.8,131.8" fill="#52606D"/><polygon points="390.0,120.0 393.8,128.2 386.2,128.2" fill="#52606D"/><polyline points="640,120 640,140" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="640.0,140.0 636.2,131.8 643.8,131.8" fill="#52606D"/><polygon points="640.0,120.0 643.8,128.2 636.2,128.2" fill="#52606D"/><rect x="20" y="322" width="360" height="80" rx="8" ry="8" fill="#FDE8E8" stroke="#B42318" stroke-width="1.6"/><text x="200.0" y="351.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Guards</text><text x="200.0" y="365.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Enforced by tests: only the four-level band; no score or percentage; no</text><text x="200.0" y="379.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">domain data literals in src; fixed honesty copy; replays labelled</text><polyline points="580,300 580,450" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="580.0,450.0 576.2,441.8 583.8,441.8" fill="#52606D"/><rect x="587.0" y="365.1" width="128.2" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="590" y="376.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606D">same-origin /api/v1 only</text><rect x="400" y="450" width="360" height="54" rx="8" ry="8" fill="#FFFFFF" stroke="#52606D" stroke-width="1.6"/><text x="580.0" y="473.09000000000003" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Origin</text><text x="580.0" y="487.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">development: Vite proxy to 127.0.0.1:8010; hosted: Vercel rewrite</text><polyline points="580,504 580,528" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="580.0,528.0 576.2,519.8 583.8,519.8" fill="#52606D"/><rect x="400" y="528" width="360" height="54" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="580.0" y="551.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">FastAPI /api/v1</text><text x="580.0" y="565.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">15 operations used; 3 writes: assessments, decisions, ingestion runs</text><rect x="20" y="450" width="360" height="132" rx="8" ry="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.6"/><text x="200.0" y="498.06" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Constraints from the backend</text><text x="200.0" y="512.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">No new route, CORS policy, authentication or event stream exists. Live</text><text x="200.0" y="526.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">mode cannot show intermediate progress, because the API emits no</text><text x="200.0" y="540.15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">events: it shows working poses, then replays the recorded result.</text></svg>