<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520"><rect width="780" height="520" fill="#FFFFFF"/><text x="8" y="20" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606D">VS-02 revenue and pipeline intelligence: computation stages and build status</text><rect x="8" y="34" width="764" height="150" rx="10" ry="10" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1.6" stroke-dasharray="3,3"/><text x="20" y="52" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#52606D">Built (VS02-M1 and M2)</text><rect x="20" y="62" width="168" height="104" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="104.0" y="96.06" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Configuration</text><text x="104.0" y="110.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">fx_rates.yaml: one immutable</text><text x="104.0" y="124.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">rate set, base INR, USD 85,</text><text x="104.0" y="138.15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">EUR 100; pipeline_rules.yaml</text><rect x="206" y="62" width="168" height="104" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="290.0" y="96.06" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Deal facts</text><text x="290.0" y="110.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">deal_rows read: nine columns,</text><text x="290.0" y="124.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">ordered by source_id; open and</text><text x="290.0" y="138.15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">valued classification</text><rect x="392" y="62" width="168" height="104" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="476.0" y="96.06" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Per-deal measures</text><text x="476.0" y="110.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Decimal only; weighted amount</text><text x="476.0" y="124.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">rounded per deal; per-deal base</text><text x="476.0" y="138.15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">conversion</text><rect x="578" y="62" width="184" height="104" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="670.0" y="96.06" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Partitions</text><text x="670.0" y="110.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">by currency, by stage, by owner, by</text><text x="670.0" y="124.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">expected-close period; each</text><text x="670.0" y="138.15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">reconciles exactly</text><polyline points="188,114 206,114" fill="none" stroke="#52606D" stroke-width="2"/><polygon points="206.0,114.0 197.8,117.8 197.8,110.2" fill="#52606D"/><polyline points="374,114 392,114" fill="none" stroke="#52606D" stroke-width="2"/><polygon points="392.0,114.0 383.8,117.8 383.8,110.2" fill="#52606D"/><polyline points="560,114 578,114" fill="none" stroke="#52606D" stroke-width="2"/><polygon points="578.0,114.0 569.8,117.8 569.8,110.2" fill="#52606D"/><rect x="8" y="204" width="764" height="120" rx="10" ry="10" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1.6" stroke-dasharray="3,3"/><text x="20" y="222" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#52606D">Specified, not built (VS02-M3)</text><rect x="20" y="232" width="168" height="80" rx="8" ry="8" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.6"/><text x="104.0" y="254.06" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Customer partition and</text><text x="104.0" y="268.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">band cross-tab</text><text x="104.0" y="282.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">by customer, with the VS-01</text><text x="104.0" y="296.15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">band joined at an exact identity</text><rect x="206" y="232" width="168" height="80" rx="8" ry="8" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.6"/><text x="290.0" y="261.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Concentration</text><text x="290.0" y="275.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">share, top five, cumulative, HHI,</text><text x="290.0" y="289.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">in the base currency</text><rect x="392" y="232" width="168" height="80" rx="8" ry="8" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.6"/><text x="476.0" y="261.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Limitations and notes</text><text x="476.0" y="275.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">nine limitation codes and</text><text x="476.0" y="289.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">data-quality notes</text><rect x="578" y="232" width="184" height="80" rx="8" ry="8" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.6"/><text x="670.0" y="261.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">View and service</text><text x="670.0" y="275.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">the view, its SHA-256 view_hash,</text><text x="670.0" y="289.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">citations, a log event</text><polyline points="188,272 206,272" fill="none" stroke="#52606D" stroke-width="2"/><polygon points="206.0,272.0 197.8,275.8 197.8,268.2" fill="#52606D"/><polyline points="374,272 392,272" fill="none" stroke="#52606D" stroke-width="2"/><polygon points="392.0,272.0 383.8,275.8 383.8,268.2" fill="#52606D"/><polyline points="560,272 578,272" fill="none" stroke="#52606D" stroke-width="2"/><polygon points="578.0,272.0 569.8,275.8 569.8,268.2" fill="#52606D"/><polyline points="670,166 670,232" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="670.0,232.0 666.2,223.8 673.8,223.8" fill="#52606D"/><rect x="550.2" y="190.0" width="112.8" height="13.7" fill="#FFFFFF" fill-opacity="0.92"/><text x="660" y="200.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606D">partitions feed the view</text><rect x="8" y="344" width="764" height="100" rx="10" ry="10" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1.6" stroke-dasharray="3,3"/><text x="20" y="362" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#52606D">Specified, not built (VS02-M4 and M5)</text><rect x="20" y="372" width="360" height="62" rx="8" ry="8" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.6"/><text x="200.0" y="392.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">M4: API</text><text x="200.0" y="406.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">GET /api/v1/pipeline/view?as_of=... 200, 409 FX_RATE_MISSING, 422,</text><text x="200.0" y="420.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">500; no write route</text><rect x="402" y="372" width="360" height="62" rx="8" ry="8" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.6"/><text x="582.0" y="399.09000000000003" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">M5: acceptance and hardening</text><text x="582.0" y="413.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">make verify-vs02, mutation audit, end-to-end scenario, README</text><polyline points="380,403 402,403" fill="none" stroke="#52606D" stroke-width="2"/><polygon points="402.0,403.0 393.8,406.8 393.8,399.2" fill="#52606D"/><polyline points="670,312 670,334 340,334 340,372" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="340.0,372.0 336.2,363.8 343.8,363.8" fill="#52606D"/><rect x="482.1" y="320.0" width="75.8" height="13.7" fill="#FFFFFF" fill-opacity="0.92"/><text x="520" y="330.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606D">feeds the route</text><rect x="20" y="458" width="744" height="44" rx="8" ry="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.6"/><text x="392.0" y="483.105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">Reads only deals, relationship edges (customer, owner) and persisted VS-01 risk_assessments. Writes nothing: no table, no migration.</text></svg>