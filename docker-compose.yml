# =============================================================================
# AI CEO — Layer 1 Docker Compose
# Three services: postgres, api, mock-source
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — canonical data store for Layer 1.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ai-ceo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_ceo_layer1}
      POSTGRES_USER: ${POSTGRES_USER:-ai_ceo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_ceo} -d ${POSTGRES_DB:-ai_ceo_layer1}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API — FastAPI application (Layer 1 Connector subsystem).
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-ceo-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_ceo_layer1}
      POSTGRES_USER: ${POSTGRES_USER:-ai_ceo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_ceo}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-ai_ceo_layer1}
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      MOCK_SOURCE_BASE_URL: http://mock-source:8080
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-source:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mock Source — single container serving both /odoo/... and /rest/... paths.
  # A2 scaffold only. Actual endpoints are implemented in Task C3.
  # ---------------------------------------------------------------------------
  mock-source:
    build:
      context: .
      dockerfile: docker/Dockerfile.mock-source
    container_name: ai-ceo-mock-source
    environment:
      MOCK_SOURCE_HOST: 0.0.0.0
      MOCK_SOURCE_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
