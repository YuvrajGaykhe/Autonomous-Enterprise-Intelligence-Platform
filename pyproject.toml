[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ceo-layer1"
version = "0.1.0"
description = "AI CEO — Layer 1: Connector and Ingestion Subsystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",

    # Data validation and settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",

    # HTTP client (for connectors)
    "httpx>=0.27.0",
    "tenacity>=8.3.0",

    # Data processing (CSV/Excel)
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",

    # Code quality
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",

    # Type stubs
    "types-python-dateutil",
    "types-pytz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-v",
]
markers = [
    "unit: fast, isolated unit tests with no external dependencies",
    "integration: tests that require a running PostgreSQL instance",
    "contract: tests that verify connector interface compliance",
    "e2e: full end-to-end tests requiring all services",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by black
    "B008",  # do not perform function calls in default arguments (FastAPI Depends pattern)
]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
