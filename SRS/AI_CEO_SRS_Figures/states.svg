<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"><rect width="780" height="440" fill="#FFFFFF"/><rect x="8" y="8" width="372" height="420" rx="10" ry="10" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1.6" stroke-dasharray="3,3"/><text x="20" y="28" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606D">Ingestion run status</text><circle cx="60" cy="62" r="8" fill="#1F2933"/><rect x="20" y="90" width="120" height="40" rx="16" ry="16" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.6"/><text x="80.0" y="113.24000000000001" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">RUNNING</text><polyline points="60,70 60,90" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="60.0,90.0 56.2,81.8 63.8,81.8" fill="#52606D"/><rect x="220" y="52" width="150" height="52" rx="16" ry="16" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="295.0" y="66.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">SUCCESS</text><text x="295.0" y="81.24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">inserted or updated, no</text><text x="295.0" y="95.88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">failures</text><rect x="220" y="130" width="150" height="52" rx="16" ry="16" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="295.0" y="151.92000000000002" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">NOOP</text><text x="295.0" y="166.56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">nothing inserted or updated</text><rect x="220" y="208" width="150" height="64" rx="16" ry="16" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.6"/><text x="295.0" y="228.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">PARTIAL_SUCCESS</text><text x="295.0" y="243.24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">records rejected, or an</text><text x="295.0" y="257.88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">entity or batch failed</text><rect x="220" y="298" width="150" height="64" rx="16" ry="16" fill="#FDE8E8" stroke="#B42318" stroke-width="1.6"/><text x="295.0" y="311.28000000000003" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">FAILED</text><text x="295.0" y="325.92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">health check failed, or</text><text x="295.0" y="340.56000000000006" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">failures with nothing</text><text x="295.0" y="355.20000000000005" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">committed</text><polyline points="140,104 180,104 180,78 220,78" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="220.0,78.0 211.8,81.8 211.8,74.2" fill="#52606D"/><polyline points="140,110 180,110 180,156 220,156" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="220.0,156.0 211.8,159.8 211.8,152.2" fill="#52606D"/><polyline points="140,116 170,116 170,240 220,240" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="220.0,240.0 211.8,243.8 211.8,236.2" fill="#52606D"/><polyline points="140,122 160,122 160,330 220,330" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="220.0,330.0 211.8,333.8 211.8,326.2" fill="#52606D"/><text x="20" y="392" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">A run interrupted by a process crash stays RUNNING.</text><text x="20" y="408" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">A repeated, identical run ends NOOP.</text><rect x="400" y="8" width="372" height="420" rx="10" ry="10" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1.6" stroke-dasharray="3,3"/><text x="412" y="28" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606D">Brief decision status (derived)</text><circle cx="436" cy="62" r="8" fill="#1F2933"/><rect x="426" y="90" width="130" height="44" rx="16" ry="16" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.6"/><text x="491.0" y="107.92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">PENDING</text><text x="491.0" y="122.56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">no decision recorded</text><polyline points="436,70 436,90" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="436.0,90.0 432.2,81.8 439.8,81.8" fill="#52606D"/><rect x="430" y="220" width="130" height="44" rx="16" ry="16" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="495.0" y="245.24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">APPROVED</text><rect x="610" y="220" width="130" height="44" rx="16" ry="16" fill="#FDE8E8" stroke="#B42318" stroke-width="1.6"/><text x="675.0" y="245.24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">REJECTED</text><polyline points="470,134 470,220" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="470.0,220.0 466.2,211.8 473.8,211.8" fill="#52606D"/><rect x="528.2" y="149.6" width="167.5" height="14.3" fill="#FFFFFF" fill-opacity="0.92"/><text x="612" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606D">first decision, supersedes nothing</text><polyline points="540,134 540,170 675,170 675,220" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="675.0,220.0 671.2,211.8 678.8,211.8" fill="#52606D"/><polyline points="560,236 610,236" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="610.0,236.0 601.8,239.8 601.8,232.2" fill="#52606D"/><polyline points="610,250 560,250" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="560.0,250.0 568.2,246.2 568.2,253.8" fill="#52606D"/><rect x="530.9" y="269.6" width="108.2" height="14.3" fill="#FFFFFF" fill-opacity="0.92"/><text x="585" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606D">superseding decision</text><text x="412" y="330" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">Each later decision names the current head in supersedes_id.</text><text x="412" y="346" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">Rows are never updated or deleted; history is the chain.</text><text x="412" y="362" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">risk_briefs.status is stored as DRAFT and never written again.</text><text x="412" y="378" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">Decision binds to the brief's payload hash.</text></svg>