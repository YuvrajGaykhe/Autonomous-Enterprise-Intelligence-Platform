<svg xmlns="http://www.w3.org/2000/svg" width="780" height="640" viewBox="0 0 780 640"><rect width="780" height="640" fill="#FFFFFF"/><rect x="12" y="8" width="96" height="32" rx="8" ry="8" fill="#E4EEF9" stroke="#2F5F9E" stroke-width="1.6"/><text x="60.0" y="27.240000000000002" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">Client</text><polyline points="60,40 60,600" fill="none" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="142" y="8" width="96" height="32" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="190.0" y="27.240000000000002" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">API</text><polyline points="190,40 190,600" fill="none" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="282" y="8" width="96" height="32" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="330.0" y="27.240000000000002" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">Orchestrator</text><polyline points="330,40 330,600" fill="none" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="422" y="8" width="96" height="32" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="470.0" y="27.240000000000002" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">Connector</text><polyline points="470,40 470,600" fill="none" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="552" y="8" width="96" height="32" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="600.0" y="27.240000000000002" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">D1 + D2</text><polyline points="600,40 600,600" fill="none" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="672" y="8" width="96" height="32" rx="8" ry="8" fill="#EDE7F6" stroke="#5B3F9E" stroke-width="1.6"/><text x="720.0" y="27.240000000000002" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">PostgreSQL</text><polyline points="720,40 720,600" fill="none" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="4,4"/><polyline points="60,70 190,70" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="190.0,70.0 181.8,73.8 181.8,66.2" fill="#52606D"/><rect x="62.0" y="54.1" width="126.0" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="125.0" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">1 POST /ingestion/runs</text><polyline points="190,98 330,98" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="330.0,98.0 321.8,101.8 321.8,94.2" fill="#52606D"/><rect x="217.2" y="82.1" width="85.5" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="260.0" y="93" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">2 run_ingestion</text><polyline points="330,126 720,126" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="720.0,126.0 711.8,129.8 711.8,122.2" fill="#52606D"/><rect x="458.9" y="110.1" width="132.2" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="525.0" y="121" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">3 create run (RUNNING)</text><polyline points="330,154 470,154" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="470.0,154.0 461.8,157.8 461.8,150.2" fill="#52606D"/><rect x="357.9" y="138.1" width="84.2" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="400.0" y="149" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">4 health_check</text><rect x="8" y="172" width="764" height="320" rx="8" ry="8" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="3,3"/><text x="18" y="188" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#52606D">loop: each entity, parents first, each page</text><polyline points="330,216 470,216" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="470.0,216.0 461.8,219.8 461.8,212.2" fill="#52606D"/><rect x="308.4" y="200.1" width="183.2" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="400.0" y="211" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">5 fetch_entities(cursor, page_size)</text><polyline points="470,244 330,244" fill="none" stroke="#52606D" stroke-width="1.6" stroke-dasharray="5,4"/><polygon points="330.0,244.0 338.2,240.2 338.2,247.8" fill="#52606D"/><rect x="342.8" y="228.1" width="114.5" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="400.0" y="239" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">6 source-native page</text><polyline points="330,272 720,272" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="720.0,272.0 711.8,275.8 711.8,268.2" fill="#52606D"/><rect x="437.8" y="256.1" width="174.5" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="525.0" y="267" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">7 raw payloads (source_records)</text><polyline points="330,300 600,300" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="600.0,300.0 591.8,303.8 591.8,296.2" fill="#52606D"/><rect x="366.9" y="284.1" width="196.2" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="465.0" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">8 normalize and validate each record</text><polyline points="600,328 330,328" fill="none" stroke="#52606D" stroke-width="1.6" stroke-dasharray="5,4"/><polygon points="330.0,328.0 338.2,324.2 338.2,331.8" fill="#52606D"/><rect x="384.9" y="312.1" width="160.2" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="465.0" y="323" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">9 valid, warnings, quarantined</text><rect x="180" y="344" width="300" height="66" rx="5" ry="5" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.2"/><text x="330" y="363.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">10 one transaction: resolve customer FKs,</text><text x="330" y="376.75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">upsert, write ingestion_errors,</text><text x="330" y="390.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">update run counts, advance cursor</text><polyline points="330,440 720,440" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="720.0,440.0 711.8,443.8 711.8,436.2" fill="#52606D"/><rect x="423.9" y="424.1" width="202.2" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="525.0" y="435" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">11 commit (rollback the page on error)</text><text x="338" y="476" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#52606D">then the next page, or the next entity</text><polyline points="330,530 720,530" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="720.0,530.0 711.8,533.8 711.8,526.2" fill="#52606D"/><rect x="438.6" y="514.1" width="172.8" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="525.0" y="525" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">12 finalize run status and counts</text><polyline points="330,558 190,558" fill="none" stroke="#52606D" stroke-width="1.6" stroke-dasharray="5,4"/><polygon points="190.0,558.0 198.2,554.2 198.2,561.8" fill="#52606D"/><rect x="224.8" y="542.1" width="70.5" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="260.0" y="553" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">13 run result</text><polyline points="190,586 60,586" fill="none" stroke="#52606D" stroke-width="1.6" stroke-dasharray="5,4"/><polygon points="60.0,586.0 68.2,582.2 68.2,589.8" fill="#52606D"/><rect x="27.0" y="570.1" width="196.0" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="125.0" y="581" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">14 201 + summary (FAILED still 201)</text><text x="8" y="618" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#52606D">A failed health check skips the loop and ends the run FAILED.</text></svg>