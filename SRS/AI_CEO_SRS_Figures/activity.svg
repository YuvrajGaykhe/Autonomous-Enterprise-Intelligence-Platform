<svg xmlns="http://www.w3.org/2000/svg" width="780" height="900" viewBox="0 0 780 900"><rect width="780" height="900" fill="#FFFFFF"/><circle cx="250" cy="18" r="8" fill="#1F2933"/><rect x="85.0" y="40" width="330" height="44" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="250.0" y="58.089999999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">1. Resolve scope</text><text x="250.0" y="72.11999999999999" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">source_system, as_of, layer1_fingerprint</text><polyline points="250,26 250,40" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,40.0 246.2,31.8 253.8,31.8" fill="#52606D"/><rect x="85.0" y="100" width="330" height="44" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="250.0" y="118.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">2. Build the relationship model</text><text x="250.0" y="132.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">every edge carries its basis</text><polyline points="250,84 250,100" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,100.0 246.2,91.8 253.8,91.8" fill="#52606D"/><rect x="85.0" y="160" width="330" height="44" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="250.0" y="178.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">3. Compute signals S1 to S15</text><text x="250.0" y="192.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">deterministic, as of the scope date</text><polyline points="250,144 250,160" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,160.0 246.2,151.8 253.8,151.8" fill="#52606D"/><rect x="85.0" y="220" width="330" height="44" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="250.0" y="238.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">4. Assign the risk band</text><text x="250.0" y="252.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">decision table; money is never an input</text><polyline points="250,204 250,220" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,220.0 246.2,211.8 253.8,211.8" fill="#52606D"/><rect x="85.0" y="280" width="330" height="44" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="250.0" y="298.09000000000003" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">5. Derive document links</text><text x="250.0" y="312.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">ID token and exact name; evidence only</text><polyline points="250,264 250,280" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,280.0 246.2,271.8 253.8,271.8" fill="#52606D"/><rect x="85.0" y="340" width="330" height="44" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="250.0" y="358.09000000000003" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">6. Build analyst contexts</text><text x="250.0" y="372.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">typed objects, no database session</text><polyline points="250,324 250,340" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,340.0 246.2,331.8 253.8,331.8" fill="#52606D"/><rect x="85.0" y="400" width="330" height="44" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="250.0" y="418.09000000000003" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">7. Analysts emit positions</text><text x="250.0" y="432.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Support and Commercial, disjoint inputs</text><polyline points="250,384 250,400" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,400.0 246.2,391.8 253.8,391.8" fill="#52606D"/><polyline points="250,444 250,466" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,466.0 246.2,457.8 253.8,457.8" fill="#52606D"/><polygon points="250,466.0 375.0,500 250,534.0 125.0,500" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.6"/><text x="250" y="496.76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1F2933">Incompatible actions on one</text><text x="250" y="511.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1F2933">object?</text><rect x="85.0" y="556" width="330" height="50" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="250.0" y="577.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">8. Reconcile</text><text x="250.0" y="591.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">versioned policy picks the winner; the loser is kept as dissent</text><polyline points="250,534 250,556" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,556.0 246.2,547.8 253.8,547.8" fill="#52606D"/><rect x="265.0" y="538.1" width="24.0" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="268" y="549.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606D">yes</text><rect x="470" y="470" width="290" height="60" rx="8" ry="8" fill="#FDE8E8" stroke="#B42318" stroke-width="1.6"/><text x="615.0" y="489.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Unresolvable conflict</text><text x="615.0" y="503.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">If the rule's when-clause fails, the run raises: no default</text><text x="615.0" y="517.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">winner and no partial assessment</text><polyline points="375,500 470,500" fill="none" stroke="#52606D" stroke-width="1.6" stroke-dasharray="5,4"/><polygon points="470.0,500.0 461.8,503.8 461.8,496.2" fill="#52606D"/><polyline points="250,606 250,634" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,634.0 246.2,625.8 253.8,625.8" fill="#52606D"/><polygon points="250,634.0 375.0,668 250,702.0 125.0,668" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.6"/><text x="250" y="672.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1F2933">Band at least WATCH?</text><rect x="85.0" y="722" width="330" height="56" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="250.0" y="746.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">9. Generate the brief</text><text x="250.0" y="760.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">payload (hashed) and narrative (a view); every citation must resolve</text><polyline points="250,702 250,722" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,722.0 246.2,713.8 253.8,713.8" fill="#52606D"/><rect x="265.0" y="704.1" width="24.0" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="268" y="715.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606D">yes</text><rect x="470" y="640" width="290" height="56" rx="8" ry="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.6"/><text x="615.0" y="664.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">No brief</text><text x="615.0" y="678.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">The assessment is stored with band NONE; no brief exists</text><polyline points="375,668 470,668" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="470.0,668.0 461.8,671.8 461.8,664.2" fill="#52606D"/><rect x="438.5" y="651.1" width="19.0" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="448" y="662.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606D">no</text><rect x="85.0" y="806" width="330" height="44" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="250.0" y="824.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">10. Human decision</text><text x="250.0" y="838.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">separate request; bound to the payload hash</text><polyline points="250,778 250,806" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,806.0 246.2,797.8 253.8,797.8" fill="#52606D"/><circle cx="250" cy="874" r="9" fill="none" stroke="#1F2933" stroke-width="2"/><circle cx="250" cy="874" r="5" fill="#1F2933"/><polyline points="250,850 250,865" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,865.0 246.2,856.8 253.8,856.8" fill="#52606D"/><polyline points="125,500 60,500 60,630 250,630" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="250.0,630.0 241.8,633.8 241.8,626.2" fill="#52606D"/><rect x="68.5" y="483.1" width="19.0" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="78" y="494" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606D">no</text></svg>