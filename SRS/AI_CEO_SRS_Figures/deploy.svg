<svg xmlns="http://www.w3.org/2000/svg" width="780" height="640" viewBox="0 0 780 640"><rect width="780" height="640" fill="#FFFFFF"/><rect x="8" y="8" width="764" height="292" rx="12" ry="12" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1.6" stroke-dasharray="3,3"/><text x="20" y="28" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606D">Local development (Docker Compose and host tools)</text><rect x="20" y="42" width="460" height="160" rx="10" ry="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.6" stroke-dasharray="4,3"/><text x="30" y="60" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52606D">Compose network</text><rect x="32" y="72" width="130" height="62" rx="8" ry="8" fill="#EDE7F6" stroke="#5B3F9E" stroke-width="1.6"/><text x="97.0" y="92.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">postgres</text><text x="97.0" y="106.105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">port 5432, volume</text><text x="97.0" y="120.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">pgdata</text><rect x="190" y="72" width="130" height="62" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="255.0" y="92.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">api</text><text x="255.0" y="106.105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">port 8000, FastAPI,</text><text x="255.0" y="120.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">/docs</text><rect x="348" y="72" width="120" height="62" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="408.0" y="99.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">mock-source</text><text x="408.0" y="113.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">port 8080, GET only</text><polyline points="190,103 162,103" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="162.0,103.0 170.2,99.2 170.2,106.8" fill="#52606D"/><rect x="162.5" y="86.0" width="27.0" height="13.7" fill="#FFFFFF" fill-opacity="0.92"/><text x="176" y="96.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606D">SQL</text><polyline points="320,103 348,103" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="348.0,103.0 339.8,106.8 339.8,99.2" fill="#52606D"/><rect x="320.1" y="86.0" width="27.8" height="13.7" fill="#FFFFFF" fill-opacity="0.92"/><text x="334" y="96.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606D">GET</text><text x="30" y="158" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">api image bakes in config/ and data/demo; migrations are run explicitly</text><text x="30" y="176" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">(make migrate); the API never migrates at startup.</text><rect x="500" y="52" width="260" height="54" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="630.0" y="68.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Host: virtualenv and CLI</text><text x="630.0" y="82.105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">make install, migrate, ingest-demo, test,</text><text x="630.0" y="96.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">verify-layer1, verify-vs01</text><rect x="500" y="124" width="260" height="78" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="630.0" y="145.06" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Host: frontend development</text><text x="630.0" y="159.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Vite dev server :5173 proxies /api to an isolated API</text><text x="630.0" y="173.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">on 127.0.0.1:8010 and its own database</text><text x="630.0" y="187.15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">&lt;db&gt;_frontend</text><text x="20" y="226" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">Isolated databases (never the development database): &lt;db&gt;_test, &lt;db&gt;_migrations_test,</text><text x="20" y="242" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">&lt;db&gt;_vs01, &lt;db&gt;_vs02, &lt;db&gt;_frontend, &lt;db&gt;_frontend_e2e.</text><text x="20" y="270" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">The host CLI reaches PostgreSQL through the published port 5432.</text><rect x="8" y="320" width="764" height="300" rx="12" ry="12" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1.6" stroke-dasharray="3,3"/><text x="20" y="340" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606D">Hosted demo (one Vercel project, one origin, no CORS)</text><rect x="20" y="356" width="130" height="56" rx="8" ry="8" fill="#E4EEF9" stroke="#2F5F9E" stroke-width="1.6"/><text x="85.0" y="373.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Browser</text><text x="85.0" y="387.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">any modern desktop</text><text x="85.0" y="401.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">browser</text><rect x="210" y="352" width="270" height="64" rx="8" ry="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.6"/><text x="345.0" y="373.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">vercel.json</text><text x="345.0" y="387.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">rewrites: /api/*, /docs, /redoc, /openapi.json to the api</text><text x="345.0" y="401.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">service; everything else to web</text><rect x="210" y="450" width="130" height="70" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="275.0" y="481.09000000000003" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">web service</text><text x="275.0" y="495.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">frontend/ built with Vite</text><rect x="350" y="450" width="130" height="70" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="415.0" y="474.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">api service</text><text x="415.0" y="488.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">app.main:app, Python</text><text x="415.0" y="502.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">runtime, region sin1</text><rect x="560" y="450" width="196" height="70" rx="8" ry="8" fill="#EDE7F6" stroke="#5B3F9E" stroke-width="1.6"/><text x="658.0" y="474.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Neon PostgreSQL</text><text x="658.0" y="488.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">disposable, synthetic demo data,</text><text x="658.0" y="502.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Singapore</text><polyline points="150,384 210,384" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="210.0,384.0 201.8,387.8 201.8,380.2" fill="#52606D"/><rect x="159.8" y="366.0" width="40.5" height="13.7" fill="#FFFFFF" fill-opacity="0.92"/><text x="180" y="376.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606D">HTTPS</text><polyline points="275,416 275,450" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="275.0,450.0 271.2,441.8 278.8,441.8" fill="#52606D"/><polyline points="415,416 415,450" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="415.0,450.0 411.2,441.8 418.8,441.8" fill="#52606D"/><polyline points="480,485 560,485" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="560.0,485.0 551.8,488.8 551.8,481.2" fill="#52606D"/><rect x="506.5" y="468.0" width="27.0" height="13.7" fill="#FFFFFF" fill-opacity="0.92"/><text x="520" y="478.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606D">SQL</text><rect x="520" y="356" width="236" height="60" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="638.0" y="375.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">make demo-reset</text><text x="638.0" y="389.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">From the owner's machine: migrates down and</text><text x="638.0" y="403.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">up, ingests, assesses</text><polyline points="638,416 638,450" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="638.0,450.0 634.2,441.8 641.8,441.8" fill="#52606D"/><rect x="657.0" y="426.0" width="55.2" height="13.7" fill="#FFFFFF" fill-opacity="0.92"/><text x="660" y="436.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606D">direct URL</text><text x="20" y="548" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">mock-source is not deployed: the odoo_mock and rest_mock agents show their real</text><text x="20" y="564" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">failed health check on the hosted site. Anyone with the link can record a decision.</text><text x="20" y="590" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#52606D">Deployment steps are outward actions; each needs the owner's separate approval.</text></svg>