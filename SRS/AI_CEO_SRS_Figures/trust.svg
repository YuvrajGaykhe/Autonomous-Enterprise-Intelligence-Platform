<svg xmlns="http://www.w3.org/2000/svg" width="780" height="590" viewBox="0 0 780 590"><rect width="780" height="590" fill="#FFFFFF"/><rect x="8" y="8" width="764" height="70" rx="10" ry="10" fill="#F6F3FB" stroke="#5B3F9E" stroke-width="1.6"/><text x="20" y="28" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#52606D">Trust boundary 1: Layer 1 canonical tables are read-only to Layer 2</text><rect x="20" y="38" width="232" height="32" rx="8" ry="8" fill="#EDE7F6" stroke="#5B3F9E" stroke-width="1.6"/><text x="136.0" y="57.105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">customers, tickets, deals, projects</text><rect x="266" y="38" width="232" height="32" rx="8" ry="8" fill="#EDE7F6" stroke="#5B3F9E" stroke-width="1.6"/><text x="382.0" y="57.105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">employees, documents</text><rect x="512" y="38" width="248" height="32" rx="8" ry="8" fill="#EDE7F6" stroke="#5B3F9E" stroke-width="1.6"/><text x="636.0" y="57.105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2933">derived document links (Layer 2)</text><rect x="250" y="106" width="280" height="52" rx="8" ry="8" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.6"/><text x="390.0" y="120.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">Context factory</text><text x="390.0" y="135.24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">Only component holding a database session; builds</text><text x="390.0" y="149.88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2933">typed, disjoint context objects</text><polyline points="390,78 390,106" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="390.0,106.0 386.2,97.8 393.8,97.8" fill="#52606D"/><rect x="402.9" y="83.1" width="54.2" height="15.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="430" y="94.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606D">read-only</text><rect x="8" y="184" width="764" height="170" rx="10" ry="10" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1.6" stroke-dasharray="3,3"/><text x="390" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#52606D">Trust boundary 2: no session reaches an analyst</text><rect x="40" y="206" width="300" height="112" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="190.0" y="244.06" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">SupportContext</text><text x="190.0" y="258.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Tickets, SLA rules, DOC-003, signals S1 to S10, band,</text><text x="190.0" y="272.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">has_active_deal, contested_deal identity. No amounts, no</text><text x="190.0" y="286.15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">deal or project attributes.</text><rect x="440" y="206" width="300" height="112" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="590.0" y="251.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">CommercialContext</text><text x="590.0" y="265.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Deals, projects, contract documents, signals S11 to S15. No</text><text x="590.0" y="279.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">ticket records.</text><polyline points="340,158 190,158 190,206" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="190.0,206.0 186.2,197.8 193.8,197.8" fill="#52606D"/><polyline points="440,158 590,158 590,206" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="590.0,206.0 586.2,197.8 593.8,197.8" fill="#52606D"/><rect x="40" y="382" width="300" height="46" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="190.0" y="401.09000000000003" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">SupportRiskAnalyst</text><text x="190.0" y="415.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Position: PAUSE_DEAL_PUSH_..., ESCALATE_..., ...</text><rect x="440" y="382" width="300" height="46" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="590.0" y="401.09000000000003" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">CommercialAnalyst</text><text x="590.0" y="415.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Position: ACCELERATE_DEAL_CLOSE</text><polyline points="190,318 190,382" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="190.0,382.0 186.2,373.8 193.8,373.8" fill="#52606D"/><polyline points="590,318 590,382" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="590.0,382.0 586.2,373.8 593.8,373.8" fill="#52606D"/><rect x="210" y="462" width="360" height="58" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="390.0" y="480.075" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Reconciler</text><text x="390.0" y="494.10499999999996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Only module that sees both position sets. Detects incompatible actions on</text><text x="390.0" y="508.135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">one object, applies the versioned conflict policy, keeps dissent.</text><polyline points="190,428 190,445 300,445 300,462" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="300.0,462.0 296.2,453.8 303.8,453.8" fill="#52606D"/><polyline points="590,428 590,445 480,445 480,462" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="480.0,462.0 476.2,453.8 483.8,453.8" fill="#52606D"/><rect x="612" y="462" width="156" height="58" rx="8" ry="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.6"/><text x="690.0" y="487.09000000000003" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Conflict policy</text><text x="690.0" y="501.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Versioned YAML: CONF-001</text><polyline points="612,491 570,491" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="570.0,491.0 578.2,487.2 578.2,494.8" fill="#52606D"/><rect x="210" y="542" width="360" height="36" rx="8" ry="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.6"/><text x="390.0" y="556.09" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F2933">Brief</text><text x="390.0" y="570.12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2933">Hashed payload + rendered narrative; then a human decision</text><polyline points="390,520 390,542" fill="none" stroke="#52606D" stroke-width="1.6"/><polygon points="390.0,542.0 386.2,533.8 393.8,533.8" fill="#52606D"/></svg>